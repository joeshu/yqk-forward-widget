name: Test CCTV original-segment experimental service

on:
  push:
    paths:
      - 'cctv-native/**'
      - 'cctv-native.py'
      - 'cctv-aptv.py'
      - '.github/workflows/cctv-native.yml'
  pull_request:
    paths:
      - 'cctv-native/**'
      - 'cctv-native.py'
      - 'cctv-aptv.py'
      - '.github/workflows/cctv-native.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Offline unit checks
        run: python -m unittest discover -s cctv-native/tests -v
      - name: Check standalone build
        run: python cctv-native/build_service.py --check
      - name: Check APTV standalone build
        run: python cctv-native/build_aptv.py --check
      - name: Check Node syntax
        run: node --check cctv-native/engine.cjs
      - name: Check Python syntax
        run: python -m py_compile cctv-native.py cctv-native/service.py cctv-native/cctv_native_ts.py cctv-native/build_service.py
