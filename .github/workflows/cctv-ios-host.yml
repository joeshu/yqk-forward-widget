name: Build CCTVHost unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'cctv-ios-host/**'
      - '.github/workflows/cctv-ios-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cctv-ios-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          for f in cctv-ios-host/Frameworks/*.framework; do
            n="$(basename "$f" .framework)"; echo "== $n"; lipo -info "$f/$n"
          done

      - name: Build app
        working-directory: cctv-ios-host
        run: bash Scripts/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-unsigned-ipa
          path: |
            cctv-ios-host/build/CCTVHost-unsigned.ipa
            cctv-ios-host/build/CCTVHost-unsigned.ipa.sha256
          retention-days: 30
