name: Build CCTVHost unsigned IPA

on:
  push:
    branches: [main, codex/cctv-fast-switch, codex/cctv-aptv-ui, codex/cctv-startup-recovery, codex/cctv-aptv-core-017]
    paths:
      - 'cctv-ios-host/**'
      - '.github/workflows/cctv-ios-host.yml'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, no-python, baseline09]
    env:
      PY_DISABLE: ${{ matrix.variant != 'full' && '1' || '' }}
      CCTV_BASELINE: ${{ matrix.variant == 'baseline09' && '1' || '' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Python-Apple-support
        uses: actions/cache@v4
        with:
          path: /tmp/python-ios.tar.gz
          key: python-apple-support-3.13-b16

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          for f in cctv-ios-host/Frameworks/*.framework; do
            n="$(basename "$f" .framework)"; echo "== $n"; lipo -info "$f/$n"
          done

      - name: Run regression checks
        working-directory: cctv-ios-host
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Prepare historical 0.9 playback reference
        if: matrix.variant == 'baseline09'
        working-directory: cctv-ios-host
        run: |
          git fetch --depth=1 origin 2966473770c776066015ac78106602562f735f97
          python3 Scripts/prepare-baseline.py

      - name: Syntax check
        working-directory: cctv-ios-host
        run: |
          set +e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          : > syntax.log
          for f in Sources/*.m; do
            case "$f" in *PyHost.m) echo "skip $f (needs python headers, checked in build step)"; continue;; esac
            echo "== $f" >> syntax.log
            xcrun --sdk iphoneos clang -fsyntax-only -arch arm64 -isysroot "$SDK" \
              -miphoneos-version-min=15.0 -fobjc-arc -I Sources/Include \
              -F Frameworks "$f" >> syntax.log 2>&1 || true
          done
          cat syntax.log
          grep -E "error:|fatal error:" syntax.log | head -20 | sed 's/\r//' | while IFS= read -r l; do
            echo "::error title=syntax::$l"
          done
          if grep -qE "error:|fatal error:" syntax.log; then exit 1; fi

      - name: Build app
        working-directory: cctv-ios-host
        run: |
          set +e
          bash Scripts/ci-build.sh > build.log 2>&1
          rc=$?
          tail -60 build.log
          grep -E "error:|fatal error:|ld: |Undefined symbols|referenced from|No such file" build.log | head -25 | sed 's/\r//' | while IFS= read -r l; do
            echo "::error title=build::$l"
          done
          exit $rc

      - name: Validate packaged IPA
        working-directory: cctv-ios-host
        run: |
          set -o pipefail
          python3 Scripts/validate_ipa.py build/CCTVHost-unsigned.ipa | tee build/validation.json

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-${{ matrix.variant }}-${{ github.sha }}
          path: |
            cctv-ios-host/build/CCTVHost-unsigned.ipa
            cctv-ios-host/build/CCTVHost-unsigned.ipa.sha256
            cctv-ios-host/build/validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-logs-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            cctv-ios-host/build.log
            cctv-ios-host/syntax.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release asset
        if: success() && github.ref == 'refs/heads/main' && matrix.variant == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cctv-ios-host/build
          tag="cctv-ios-host-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            CCTVHost-unsigned.ipa CCTVHost-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "CCTVHost ${GITHUB_SHA:0:7}" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ). Device playback remains unverified."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CCTVHost-${{ matrix.variant }}-unsigned-ipa
          path: |
            cctv-ios-host/build/CCTVHost-unsigned.ipa
            cctv-ios-host/build/CCTVHost-unsigned.ipa.sha256
          retention-days: 30

  ui-preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run simulator UI smoke checks
        working-directory: cctv-ios-host
        run: bash Scripts/ui-smoke.sh
      - name: Preserve UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-UI-preview-${{ github.sha }}
          path: |
            cctv-ios-host/ui-preview/*.png
            cctv-ios-host/ui-preview/results.json
          if-no-files-found: error
