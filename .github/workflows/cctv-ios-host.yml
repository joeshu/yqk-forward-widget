name: Build CCTVHost unsigned IPA

on:
  push:
    branches: [main, codex/cctv-fast-switch, codex/cctv-aptv-ui, codex/cctv-startup-recovery, codex/cctv-aptv-core-017, 'fix/cctv-playback-subscriptions-*']
    paths:
      - 'cctv-ios-host/**'
      - '.github/workflows/cctv-ios-host.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified IPA as a GitHub Release"
        required: false
        default: true
        type: boolean
      run_media_compat:
        description: "Run the longer live-catalogue AVFoundation compatibility matrix"
        required: false
        default: false
        type: boolean

permissions:
  contents: write


jobs:
  source-audit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
      - name: Inventory and check all app sources
        working-directory: cctv-ios-host
        run: python3 Scripts/source_audit.py --output source-audit.json
      - name: Analyze native app sources
        if: always()
        working-directory: cctv-ios-host
        run: bash Scripts/audit_native.sh native-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCTVHost-source-audit-${{ github.sha }}
          path: |
            cctv-ios-host/source-audit.json
            cctv-ios-host/native-audit/
          retention-days: 30

  media-compat:
    if: github.event_name == 'workflow_dispatch' && inputs.run_media_compat == true
    uses: ./.github/workflows/cctv-media-compat.yml
    permissions:
      contents: read

  jar-runtime:
    name: JAR runtime (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [ios, ios-simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: cctv-ios-host/Runtime/JAR/upstream.json
      - uses: actions/cache@v4
        with:
          path: cctv-ios-host/.jar-runtime
          key: jar-zero-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('cctv-ios-host/Runtime/JAR/upstream.json', 'cctv-ios-host/Scripts/prepare_jar_runtime.sh') }}
      - name: Install native runtime build tools
        run: |
          brew install autoconf automake libtool pkg-config make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build interpreter-only JAR runtime
        working-directory: cctv-ios-host
        run: bash Scripts/prepare_jar_runtime.sh '${{ matrix.target }}'
      - name: Package runtime artifact
        working-directory: cctv-ios-host
        run: |
          platform=iphoneos
          if [ '${{ matrix.target }}' = ios-simulator ]; then platform=iphonesimulator; fi
          tar -czf jar-runtime-${{ matrix.target }}.tgz -C .jar-runtime "$platform"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-runtime-${{ matrix.target }}
          path: cctv-ios-host/jar-runtime-${{ matrix.target }}.tgz
          retention-days: 14

  build:
    needs: [jar-runtime, source-audit]
    strategy:
      fail-fast: false
      matrix:
        variant: [full]
    env:
      PY_DISABLE: ${{ matrix.variant != 'full' && '1' || '' }}
      CCTV_BASELINE: ${{ matrix.variant == 'baseline09' && '1' || '' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar-runtime-ios
          path: cctv-ios-host
      - name: Unpack JAR runtime
        working-directory: cctv-ios-host
        run: mkdir -p .jar-runtime && tar -xzf jar-runtime-ios.tgz -C .jar-runtime

      - name: Cache Python-Apple-support
        uses: actions/cache@v4
        with:
          path: /tmp/python-ios.tar.gz
          key: python-apple-support-3.13-b16

      - uses: actions/cache@v4
        with:
          path: /tmp/cctvhost-node-mobile-ios.zip
          key: cctvhost-node-mobile-ios-18.20.4-8c5ca3a0

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          for f in cctv-ios-host/Frameworks/*.framework; do
            n="$(basename "$f" .framework)"; echo "== $n"; lipo -info "$f/$n"
          done

      - name: Build and verify original JS plugin
        working-directory: cctv-ios-host/JSPlugins
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Match regression runtime to embedded Node.js Mobile
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.4

      - name: Run regression checks
        working-directory: cctv-ios-host
        run: |
          CCTVHOST_TEST_PYTHON_DEPS="${RUNNER_TEMP}/cctvhost-test-python-deps"
          python3 -m pip install --disable-pip-version-check --target "$CCTVHOST_TEST_PYTHON_DEPS" -r Scripts/media-python-requirements.txt
          export PYTHONPATH="$CCTVHOST_TEST_PYTHON_DEPS${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          python3 -m unittest discover -s Tests -p 'test_*.py' -v > regression.log 2>&1
          rc=$?
          cat regression.log
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("regression.log").read_text(errors="replace").splitlines()
          patterns = re.compile(r"FAIL:|ERROR:|FAILED|AssertionError:|Traceback|error:|Ran [0-9]+ tests")
          found = []
          for index, line in enumerate(lines):
              if patterns.search(line):
                  for detail in lines[index:min(len(lines), index + 3)]:
                      if detail.strip() and detail not in found:
                          found.append(detail.strip())
          for detail in found[:24]:
              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
              print(f"::error title=Regression failure::{escaped}")
          PY
          fi
          exit "$rc"

      - name: Syntax check
        working-directory: cctv-ios-host
        run: |
          set +e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          : > syntax.log
          for f in Sources/*.m; do
            case "$f" in *PyHost.m) echo "skip $f (needs python headers, checked in build step)"; continue;; esac
            echo "== $f" >> syntax.log
            xcrun --sdk iphoneos clang -fsyntax-only -arch arm64 -isysroot "$SDK" \
              -miphoneos-version-min=15.0 -fobjc-arc -I Sources/Include \
              -F Frameworks "$f" >> syntax.log 2>&1 || true
          done
          cat syntax.log
          grep -E ":[0-9]+:[0-9]+: (fatal )?error:|clang: error:" syntax.log | head -20 | sed 's/\r//' | while IFS= read -r l; do
            echo "::error title=syntax::$l"
          done
          if grep -qE ":[0-9]+:[0-9]+: (fatal )?error:|clang: error:" syntax.log; then exit 1; fi

      - name: Compute next version
        id: next_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Marketing version starts at 1.1 and increments by one per build:
          # take the highest released version and bump its last component.
          # (Release list order is not trusted, so take the max, not the first.)
          base=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' cctv-ios-host/Resources/Info.plist)
          # gh CLI 在 runner 上取发布列表不可靠（曾返回空），改用 curl + API。
          last=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=50" | jq -r '.[].name' | sed -n 's/^CCTVHost \([0-9][0-9.]*\) ([0-9][0-9]*)$/\1/p' | python3 -c "import sys; vs=[l.strip() for l in sys.stdin if l.strip()]; print(max(vs, key=lambda v: tuple(map(int, v.split('.')))) if vs else '')")
          if [ -n "$last" ]; then
            next=$(python3 -c "v='$last'.split('.'); v[-1]=str(int(v[-1])+1); print('.'.join(v))")
          else
            next="$base"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (last released: ${last:-none}, base in repo: $base)"

      - name: Build app
        working-directory: cctv-ios-host
        env:
          CCTV_NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          set +e
          bash Scripts/ci-build.sh > build.log 2>&1
          rc=$?
          tail -60 build.log
          grep -E "(^| )[^ ]+:[0-9]+:[0-9]+: (fatal )?error:|^ld: |Undefined symbols|^clang: error:|No such file" build.log | head -25 | sed 's/\r//' | while IFS= read -r l; do
            echo "::error title=build::$l"
          done
          exit $rc

      - name: Validate packaged IPA
        working-directory: cctv-ios-host
        run: |
          set -o pipefail
          python3 Scripts/validate_ipa.py build/CCTVHost-unsigned.ipa | tee build/validation.json

      - name: Analyze embedded Python bridge
        working-directory: cctv-ios-host
        run: CCTV_AUDIT_ONLY=PyHost bash Scripts/audit_native.sh python-native-audit

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-full-unsigned-ipa
          path: |
            cctv-ios-host/build/CCTVHost-unsigned.ipa
            cctv-ios-host/build/CCTVHost-unsigned.ipa.sha256
            cctv-ios-host/build/validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-logs-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            cctv-ios-host/build.log
            cctv-ios-host/syntax.log
            cctv-ios-host/regression.log
            cctv-ios-host/python-native-audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release asset
        if: success() && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)) && matrix.variant == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cctv-ios-host/build
          tag="cctv-ios-host-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' CCTVHost.app/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' CCTVHost.app/Info.plist)
          gh release create "$tag" \
            CCTVHost-unsigned.ipa CCTVHost-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "CCTVHost ${version} (${build})" \
            --notes "Version ${version}, build ${build}. Built from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ). Device playback remains unverified."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"

  jar-smoke:
    needs: jar-runtime
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-runtime-ios-simulator
          path: cctv-ios-host
      - name: Verify embedded DEX to native playback
        working-directory: cctv-ios-host
        run: |
          mkdir -p .jar-runtime
          tar -xzf jar-runtime-ios-simulator.tgz -C .jar-runtime
          bash Scripts/jar_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCTVHost-JAR-smoke-${{ github.sha }}
          path: |
            cctv-ios-host/jar-preview/*.json
            cctv-ios-host/jar-preview/*.log
          if-no-files-found: ignore

  ui-preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/cctvhost-node-mobile-ios.zip
          key: cctvhost-node-mobile-ios-18.20.4-8c5ca3a0
      - name: Run simulator UI smoke checks
        working-directory: cctv-ios-host
        run: bash Scripts/ui-smoke.sh
      - name: Preserve UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCTVHost-UI-preview-${{ github.sha }}
          path: |
            cctv-ios-host/ui-preview/*.png
            cctv-ios-host/ui-preview/*.json
            cctv-ios-host/ui-preview/*.log
            cctv-ios-host/ui-preview/*.txt
            cctv-ios-host/ui-preview/*.ips
            cctv-ios-host/ui-preview/*.crash
            cctv-ios-host/ui-preview/*.hang
          if-no-files-found: error
