name: Test CCTV webpage experimental service
on:
  push:
    paths:
      - 'cctv-web/**'
      - '.github/workflows/cctv-web.yml'
  pull_request:
    paths:
      - 'cctv-web/**'
      - '.github/workflows/cctv-web.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s cctv-web/tests -v
