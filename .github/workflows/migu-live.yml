name: Test Migu local dynamic service

on:
  push:
    paths:
      - 'migu-live.py'
      - 'migu/service.py'
      - 'migu/native.py'
      - 'migu/source.py'
      - 'migu/core.py'
      - 'migu/workers.py'
      - 'migu/epg.py'
      - 'migu/probe.py'
      - 'migu/build_service.py'
      - 'migu/capture_reference.cjs'
      - 'migu/migu-live-v*.py'
      - 'migu/migu-live-v*.json'
      - 'update_migu.py'
      - 'tests/migu_live/**'
      - '.github/workflows/migu-live.yml'
  pull_request:
    paths:
      - 'migu-live.py'
      - 'migu/service.py'
      - 'migu/native.py'
      - 'migu/source.py'
      - 'migu/core.py'
      - 'migu/workers.py'
      - 'migu/epg.py'
      - 'migu/probe.py'
      - 'migu/build_service.py'
      - 'migu/capture_reference.cjs'
      - 'migu/migu-live-v*.py'
      - 'migu/migu-live-v*.json'
      - 'update_migu.py'
      - 'tests/migu_live/**'
      - '.github/workflows/migu-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/migu -v
      - run: python3 -m unittest discover -s tests/migu_live -v
      - run: python3 migu/build_service.py --check
      - run: python3 migu-live.py --help
