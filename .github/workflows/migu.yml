name: Validate and refresh Migu playlist

on:
  push:
    branches: [main]
    paths:
      - 'update_migu.py'
      - 'migu.m3u8'
      - 'migu-status.json'
      - 'migu/**'
      - 'tests/migu/**'
      - '.github/workflows/migu.yml'
  pull_request:
    paths:
      - 'update_migu.py'
      - 'migu.m3u8'
      - 'migu/**'
      - 'tests/migu/**'
      - '.github/workflows/migu.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migu-playlist
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /update_migu.py
            /migu.m3u8
            /migu/
            /tests/migu/
      - run: python3 -m unittest discover -s tests/migu -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }} # Publish exactly the revision tested above; conflicts fail safely.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /update_migu.py
            /migu.m3u8
            /migu-status.json
      - name: Download and validate before replacing the published catalogue
        run: python3 update_migu.py
      - name: Commit only a changed catalogue or publication record
        shell: bash
        run: |
          git add -- migu.m3u8 migu-status.json
          if git diff --cached --quiet; then
            echo 'No catalogue change.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated Migu playlist'
          git push origin HEAD:main
